[project]
name = "whatsapp-billing-bot"
version = "0.1.0"
description = "AI-powered WhatsApp assistant for invoice processing and billing management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    # AI
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    # Document parsing
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.4",
    # Google Cloud
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.17",
    "google-cloud-tasks>=2.16",
    "google-auth>=2.30",
    # Vector store
    "pinecone>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
