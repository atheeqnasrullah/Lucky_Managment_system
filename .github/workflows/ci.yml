name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Type-check
        run: mypy app

      - name: Set up gcloud (Firestore emulator)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta,cloud-firestore-emulator

      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:8085 > emulator.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:8085 >/dev/null && break; sleep 1; done

      - name: Test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085
          GOOGLE_CLOUD_PROJECT: demo-test
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=75

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t billing-bot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name bot -p 8080:8080 billing-bot:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs bot; exit 1
